<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogChat - Create Account</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Create Account</h2>
        <input type="text" id="username" placeholder="Enter username">
        <input type="email" id="email" placeholder="Enter email">
        <input type="password" id="password" placeholder="Enter password">
        <button onclick="createAccount()">Sign Up</button>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBHbMOy6kGvBb1i5sv8iDE_YP_GBVySuZ0",
            authDomain: "dogchatt.firebaseapp.com",
            databaseURL: "https://dogchatt-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dogchatt",
            storageBucket: "dogchatt.firebasestorage.app",
            messagingSenderId: "898223364168",
            appId: "1:898223364168:web:b67c10a5783a14f349207d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        function createAccount() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            auth.createUserWithEmailAndPassword(email, password)
                .then(userCredential => {
                    const user = userCredential.user;
                    db.ref('users/' + user.uid).set({
                        username: username,
                        email: email,
                        uid: user.uid
                    });
                    alert('Account created successfully!');
                    window.location.href = 'chat.html';
                })
                .catch(error => alert(error.message));
        }
    </script>
</body>
</html>
